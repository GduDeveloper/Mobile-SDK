// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {
    dependencies {
        // fork 源码后的地址：https://github.com/vicyang21/fat-aar-android
        classpath 'com.github.kezong:fat-aar:1.3.8.3'
    }
}

plugins {
    alias(versions.plugins.android.application) apply false
    alias(versions.plugins.android.library) apply false
    alias(versions.plugins.kotlin.android) apply false
    alias(versions.plugins.kotlin.serialization) apply false
}

apply from: "config.gradle"


task clean(type: Delete) {
    delete rootProject.buildDir
}
