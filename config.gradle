    gduVers.gduLibBle       = "com.gdu.lib:GduLibBle:0.1.6-EP"
    gduVers.GduLibSdr       = "com.gdu.lib:GduLibSdr:0.1.5-EP"
    gduVers.gduLibGdc       = "com.gdu.lib:GduLibGdc:0.1.12-EP"
    gduVers.gduLibMqtt      = "com.gdu.lib:GduLibMqtt:0.1.7-EP"
