    gduVers.gduSdkRouteEngine   = "com.gdu.sdk:GduSdkRouteEngine:0.1.7-EP"
    gduVers.gduSdkSoundEngine   = "com.gdu.sdk:GduSdkSoundEngine:0.1.9-EP"
    gduVers.gduSdkCloudApi      = "com.gdu.sdk:GduSdkCloudApi:0.1.7-EP"

    gduVers.mapComponent = "com.gdu.app.sdk:gdu-map-component:0.2.054"
    gduVers.gduMapKit = "com.gdu.app.sdk:gdu-mapkit:0.2.054"

    gduVers.gduAppSip = "com.gdu:gdu-app-sip:0.1.2"

