apply plugin: 'com.android.application'
apply plugin: 'kotlin-android'

android {
    compileSdk 34
    defaultConfig {
        applicationId "com.gdu.demo"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"

        ndk {
            abiFilters  "arm64-v8a"
        }
    }
    signingConfigs {
        release {
            keyAlias 'GDU_MSDK_DEMO'
            keyPassword 'gdu_sdk'
            storeFile file('key/GDU_SDKdemo.jks')
            storePassword 'gdu_sdk'
        }
    }

    buildTypes {
        release {
            signingConfig signingConfigs.release
            shrinkResources false
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            signingConfig signingConfigs.release
            shrinkResources false
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    sourceSets {
        main {
            jniLibs.srcDirs = ['libs']
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = JavaVersion.VERSION_17.toString()
    }

    packagingOptions {
        jniLibs {
            useLegacyPackaging = true // 开启旧版打包方式
        }
        // 排除所有 META-INF/DEPENDENCIES 文件
        exclude 'META-INF/DEPENDENCIES'
        // 处理重复的 native 库
        pickFirst 'lib/arm64-v8a/liblog.so'
        pickFirst 'lib/armeabi-v7a/liblog.so'
        // 处理 GduSdkRouteEngine 和 GduLibJni 之间重复的 GDAL/PROJ 相关库
        pickFirst 'lib/arm64-v8a/libgdal.so'
        pickFirst 'lib/arm64-v8a/libproj.so'
        pickFirst 'lib/arm64-v8a/libsqlite3.so'
        pickFirst 'lib/arm64-v8a/libgeos.so'
        pickFirst 'lib/arm64-v8a/libgeos_c.so'
        pickFirst 'lib/arm64-v8a/libtiff.so'
        pickFirst 'lib/arm64-v8a/libgeotiff.so'
        pickFirst 'lib/arm64-v8a/libcurl.so'
        pickFirst 'lib/arm64-v8a/libpng.so'
        pickFirst 'lib/arm64-v8a/libjpeg.so'
        pickFirst 'lib/arm64-v8a/libwebp.so'
        pickFirst 'lib/arm64-v8a/libexpat.so'
        pickFirst 'lib/arm64-v8a/libxml2.so'
        pickFirst 'lib/arm64-v8a/libz.so'
        pickFirst 'lib/arm64-v8a/libssl.so'
        pickFirst 'lib/arm64-v8a/libcrypto.so'
    }

    applicationVariants.all { variant ->
        variant.outputs.all{
            def dateStr = new Date().format("yyyyMMdd-HHmm")
            outputFileName = "Gdu_MSDK_demo_${dateStr}.apk"
        }
    }

    buildFeatures {
        viewBinding true
    }
}

dependencies {
//    implementation fileTree(include: ['*.jar', '*.aar'], dir: 'libs')

    implementation "androidx.appcompat:appcompat:1.3.1"
    implementation "androidx.lifecycle:lifecycle-runtime-ktx:2.3.1"
    implementation "androidx.lifecycle:lifecycle-viewmodel-ktx:2.3.1"
    implementation "androidx.fragment:fragment-ktx:1.7.0"
    implementation 'androidx.constraintlayout:constraintlayout:1.1.3'
    api 'androidx.recyclerview:recyclerview:1.2.1'
//    implementation 'io.github.cymchad:BaseRecyclerViewAdapterHelper4:4.1.1'
    implementation "com.github.CymChad:BaseRecyclerViewAdapterHelper:3.0.4"
    implementation 'com.github.bumptech.glide:glide:4.9.0'
    annotationProcessor 'com.github.bumptech.glide:compiler:4.9.0'
    api "io.reactivex.rxjava3:rxandroid:3.0.2"
    api "com.github.liujingxing.rxlife:rxlife-rxjava3:2.2.2"
    implementation 'com.google.android.flexbox:flexbox:3.0.0'


    api "com.orhanobut:logger:2.2.0"
    api "org.greenrobot:eventbus:3.3.1"
    api "com.google.code.gson:gson:2.10.1"
//    api  files('libs/GduLibrary-2.0.77.aar')
    if (rootProject.ext.sourceEnable) {
        // 源码级联模式: 依赖GduWrapper源码坐标(会被dependencySubstitution替换为源码工程)
        implementation gduVers.gduMSdk
        implementation gduVers.gduWrapper
        implementation gduVers.gduLibGdc
        implementation gduVers.gduSdkSoundEngine
    } else {
        api files('libs/msdk-3.0.0.aar')
        api  files('libs/GduSdkSoundEngine-release.aar')
    }
    api 'com.google.code.gson:gson:2.8.2'
//    api 'com.yolanda.nohttp:nohttp:1.0.3'
    api 'com.amap.api:3dmap:7.3.0'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-core:1.8.1'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.8.1'
    implementation 'org.eclipse.paho:org.eclipse.paho.client.mqttv3:1.2.5'
    // 替换Shape的背景库: https://github.com/JavaNoober/BackgroundLibrary
    implementation 'com.github.JavaNoober.BackgroundLibrary:libraryx:1.7.5'
    // https://github.com/youth5201314/banner
    implementation 'io.github.youth5201314:banner:2.2.2'
    implementation 'androidx.legacy:legacy-support-v4:1.0.0'
    implementation 'cc.taylorzhang:single-click:1.1.0'
    implementation 'org.locationtech.jts:jts-core:1.18.2'
    implementation 'androidx.cardview:cardview:1.0.0'
    implementation 'androidx.viewpager2:viewpager2:1.0.0'
    //TabLayout https://github.com/H07000223/FlycoTabLayout
    implementation 'io.github.h07000223:flycoTabLayout:3.0.0'
    //折线图柱状图 https://github.com/PhilJay/MPAndroidChart
    implementation 'com.github.PhilJay:MPAndroidChart:v3.1.0-alpha'
    implementation 'org.greenrobot:greendao:3.3.0'
    implementation 'io.github.yuweiguocn:GreenDaoUpgradeHelper:v2.2.1'
    implementation 'com.tencent:mmkv:2.0.2'
    implementation 'io.github.cymchad:BaseRecyclerViewAdapterHelper4:4.1.4'
    api 'com.elvishew:xlog:1.11.1'
}
