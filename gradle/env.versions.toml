androidx-lifecycle-livedata-ktx = { group = "androidx.lifecycle", name="lifecycle-livedata-ktx", version.ref="lifecycleViewModelLiveDataVersion"}
material = { group = "com.google.android.material", name = "material", version.ref = "material" }
androidx-activity = { group = "androidx.activity", name = "activity", version.ref = "activity" }
androidx-constraintlayout = { group = "androidx.constraintlayout", name = "constraintlayout", version.ref = "constraintlayout" }
amap-thridD = { group="com.amap.api", name="3dmap", version.ref="amapVersion" }
amap-location= { group="com.amap.api", name="location", version.ref="amapVersion" }
