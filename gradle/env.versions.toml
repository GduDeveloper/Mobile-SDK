therouter           = { id = "cn.therouter", version.ref = "therouter" }
googleServicePlugin = { id = "com.google.gms.google-services", version.ref = "googleServiceVersion" }
hiltAndroidGradlePlugin = { id = "com.google.dagger.hilt.android", version.ref = "hiltAndroidGradlePluginVersion" }

[libraries]
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
