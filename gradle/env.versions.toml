mapbox = { group = "com.mapbox.maps", name="android", version.ref="mapboxVersion" }
mapbox-sdk-service = { group = "com.mapbox.mapboxsdk", name="mapbox-sdk-services", version.ref="mapboxSdkVersion"}
mapbox-sdk-turf = { group = "com.mapbox.mapboxsdk", name="mapbox-sdk-turf", version.ref="mapboxSdkVersion"}
jts-core = { group = "org.locationtech.jts", name = "jts-core", version.ref = "jtsCoreVersion"}
androidx-appcompat = { group = "androidx.appcompat", name="appcompat", version.ref="androidxAppcompatVersion"}
